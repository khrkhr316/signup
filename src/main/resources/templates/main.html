<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
    <title>MAIN PAGE</title>

    <link rel="stylesheet" href="/css/main.css">
</head>
<script>

    /* 우클릭 방지 */
    document.addEventListener("contextmenu", (e) => {

        e.preventDefault();
    });

    /* Ctrl + 마우스휠 확대 방지 */
    document.addEventListener("wheel", (e) => {

        if (e.ctrlKey) {

            e.preventDefault();
        }

    }, { passive: false });

    /* Ctrl + +/- 확대 방지 */
    document.addEventListener("keydown", (e) => {

        if (
            (e.ctrlKey || e.metaKey) &&
            (
                e.key === "+" ||
                e.key === "-" ||
                e.key === "="
            )
        ) {

            e.preventDefault();
        }
    });

    /* 모바일 핀치줌 방지 */
    document.addEventListener('touchmove', (e) => {

        if (e.scale !== 1) {

            e.preventDefault();
        }

    }, { passive: false });

</script>

<body>

    <div class="background-blur"></div>

    <div class="container">

        <div class="emoji">✨</div>

        <h1 class="title">WELCOME</h1>

        <!-- session 있으면 = 로그인 상태 -->
        <div th:if="${loginUser != null}">

            <div class="welcome-box">
                <p class="welcome-text">
                    😍 안녕하세요 😍
                </p>
            </div>

            <div class="menu">
                <a href="/logout" class="btn logout-btn">
                    😐 Logout 😐
                </a>
            </div>

        </div>

        <!-- session 없으면 = 로그아웃 상태 -->
        <div th:if="${loginUser == null}">
            <p class="subtitle">
                로그인하고 서비스를 이용해보세요
            </p>

            <div class="menu">

                <a href="/signup" class="btn">
                    Sign Up
                </a>

                <a href="/login" class="btn">
                    Sign In
                </a>

            </div>

        </div>

    </div>

</body>

</html>
