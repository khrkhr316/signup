<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
    <title>MAIN PAGE</title>

    <link rel="stylesheet" href="/css/main.css">
</head>
<script>

    /* 우클릭 방지 */
    document.addEventListener("contextmenu", (e) => {

        e.preventDefault();
    });

    /* Ctrl + 마우스휠 확대 방지 */
    document.addEventListener("wheel", (e) => {

        if (e.ctrlKey) {

            e.preventDefault();
        }

    }, { passive: false });

    /* Ctrl + +/- 확대 방지 */
    document.addEventListener("keydown", (e) => {

        if (
            (e.ctrlKey || e.metaKey) &&
            (
                e.key === "+" ||
                e.key === "-" ||
                e.key === "="
            )
        ) {

            e.preventDefault();
        }
    });

    /* 모바일 핀치줌 방지 */
    document.addEventListener('touchmove', (e) => {

        if (e.scale !== 1) {

            e.preventDefault();
        }

    }, { passive: false });

</script>

<body>

    <div class="background"></div>

    <main class="layout">

        <section class="hero">

            <div class="logo">
                AUTH SERVICE
            </div>

            <h1>
                Secure Authentication <br>
                For Modern Web Services
            </h1>

            <p>
                Spring Boot 기반 사용자 인증 시스템<br>
                회원가입, 로그인, 세션 인증, 보안 기능 구현
            </p>

        </section>

        <section class="card">

            <div class="status-dot"></div>

            <h2>Welcome Back</h2>

            <!-- 로그인 상태 -->
            <div th:if="${loginUser != null}">

                <div class="user-box">
                    <span class="user-label">
                        Logged In
                    </span>

                    <p class="user-email" th:text="${loginUser}">
                    </p>
                </div>

                <a href="/logout" class="primary-btn logout-btn">
                    Logout
                </a>

            </div>

            <!-- 로그아웃 상태 -->
            <div th:if="${loginUser == null}">

                <p class="description">
                    서비스를 이용하려면 로그인해주세요.
                </p>

                <div class="button-group">

                    <a href="/signup" class="primary-btn">
                        Create Account
                    </a>

                    <a href="/login" class="secondary-btn">
                        Sign In
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
