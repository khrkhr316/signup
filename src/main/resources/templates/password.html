<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
    <title>비밀번호 찾기</title>
    <!-- Bootstrap CSS 추가 -->
    <link rel="stylesheet" href="/css/password.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</head>
<script>

    /* 우클릭 방지 */
    document.addEventListener("contextmenu", (e) => {

        e.preventDefault();
    });

    /* Ctrl + 마우스휠 확대 방지 */
    document.addEventListener("wheel", (e) => {

        if (e.ctrlKey) {

            e.preventDefault();
        }

    }, { passive: false });

    /* Ctrl + +/- 확대 방지 */
    document.addEventListener("keydown", (e) => {

        if (
            (e.ctrlKey || e.metaKey) &&
            (
                e.key === "+" ||
                e.key === "-" ||
                e.key === "="
            )
        ) {

            e.preventDefault();
        }
    });

    /* 모바일 핀치줌 방지 */
    document.addEventListener('touchmove', (e) => {

        if (e.scale !== 1) {

            e.preventDefault();
        }

    }, { passive: false });

</script>

<body>
    <div class="container">
        <!-- Modal -->
        <div class="modal fade" id="myModal" role="dialog">
            <div class="modal-dialog">
                <!-- Modal content-->
                <div class="modal-content">
                    <div class="top-links">

                        <a href="/" class="nav-btn">
                            🏠 MAIN
                        </a>

                        <div class="page-title">

                        </div>

                        <a href="/login" class="nav-btn">
                            🔑 SIGN IN
                        </a>

                    </div>
                    <div class="modal-header" style="padding:35px 50px;">
                        <h4><span class="glyphicon glyphicon-lock"></span> 비밀번호 찾기</h4>
                        <h1>Railway 무료 환경에서 Gmail SMTP 연결이 불가능해서 이 기능은 막아두겠습니다,,,</h1>
                    </div>
                    <div class="modal-body" style="padding:40px 50px;">
                        <div style="color: #ac2925">
                            <center>입력된 Email로 임시 비밀번호가 전송됩니다.</center>
                        </div>
                        <hr>
                        <form role="form">
                            <div class="form-group">
                                <label for="id"><span class="glyphicon glyphicon-user"></span> User Name</label>
                                <input type="text" class="form-control" id="id" placeholder="가입시 등록한 이름을 입력하세요.">
                            </div>
                            <div class="form-group">
                                <label for="email"><span class="glyphicon glyphicon-envelope"></span> Email</label>
                                <input type="email" class="form-control" id="email" placeholder="가입시 등록한 이메일을 입력하세요.">
                            </div>
                            <button type="button" class="btn btn-success btn-block" id="checkEmail" disabled>확인</button>
                        </form>
                        <hr>
                        <div class="text-center small mt-2" id="checkMsg" style="color: red"></div>
                    </div>
                    <div class="modal-footer">
                        <form action="/login">
                            <button type="submit" class="btn btn-danger btn-default pull-left" data-dismiss="modal"
                                onclick="window.location.href='/login'">
                                <span class="glyphicon glyphicon-remove"></span> 취소
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    $(document).ready(function () {
        $('#myModal').modal('show');

        $('.modal').on('hidden.bs.modal', function (e) {
            console.log('modal close');
            $(this).find('form')[0].reset()
        });

        $("#checkEmail").click(function () {
            let id = $("#id").val();
            let email = $("#email").val();

            $.ajax({
                type: "GET",
                url: "/check/findPw",
                data: {
                    "id": id,
                    "email": email
                },
                success: function (res) {
                    if (res['check']) {
                        swal("발송 완료!", "입력하신 이메일로 임시비밀번호가 발송되었습니다.", "success").then((OK) => {
                            if (OK) {
                                $.ajax({
                                    type: "POST",
                                    url: "/check/findPw/sendEmail",
                                    data: {
                                        "id": id,
                                        "email": email
                                    },

                                    success: function () {

                                        window.location = "/login";
                                    }
                                });
                            }
                        });
                        $('#checkMsg').html('<p style="color:darkblue"></p>');
                    } else {
                        $('#checkMsg').html('<p style="color:red">일치하는 정보가 없습니다.</p>');
                    }
                }
            });
        });
    });
</script>

</html>
