<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
    <title>SIGN UP</title>

    <!-- css 파일 연결 -->
    <link rel="stylesheet" href="/css/signup.css">
</head>
<script>

    /* 우클릭 방지 */
    document.addEventListener("contextmenu", (e) => {

        e.preventDefault();
    });

    /* Ctrl + 마우스휠 확대 방지 */
    document.addEventListener("wheel", (e) => {

        if (e.ctrlKey) {

            e.preventDefault();
        }

    }, { passive: false });

    /* Ctrl + +/- 확대 방지 */
    document.addEventListener("keydown", (e) => {

        if (
            (e.ctrlKey || e.metaKey) &&
            (
                e.key === "+" ||
                e.key === "-" ||
                e.key === "="
            )
        ) {

            e.preventDefault();
        }
    });

    /* 모바일 핀치줌 방지 */
    document.addEventListener('touchmove', (e) => {

        if (e.scale !== 1) {

            e.preventDefault();
        }

    }, { passive: false });

</script>

<body>

    <div class="background"></div>

    <main class="layout">

        <!-- LEFT -->
        <section class="hero">

            <div class="badge">
                AUTH SERVICE
            </div>

            <h1>
                Create Your <br>
                Secure Account
            </h1>

            <p>
                Spring Boot 기반 인증 시스템 <br>
                보안 중심 회원가입 및 로그인 기능 구현
            </p>

            <div class="feature-box">

                <div>✔ BCrypt Password Encryption</div>

                <div>✔ Session Authentication</div>

                <div>✔ AJAX Email Validation</div>

            </div>

        </section>

        <!-- RIGHT -->
        <section class="card">

            <div class="top-nav">

                <a href="/">Main</a>

                <a href="/login">Sign In</a>

            </div>

            <h2>Create Account</h2>

            <p class="description">
                새로운 계정을 생성하세요.
            </p>

            <form action="/signup" method="post" class="form">

                <input type="text" name="username" placeholder="User Name" class="input" required>

                <input type="email" id="email" name="email" placeholder="Email" class="input" required>

                <button type="button" id="check-email" class="secondary-btn">

                    Check Email

                </button>

                <input type="password" id="password" name="password" placeholder="Password" class="input" required>

                <!-- PASSWORD RULE -->
                <div class="password-rules">

                    <p id="rule-special" class="invalid">
                        ✖ Special Character
                    </p>

                    <p id="rule-letter" class="invalid">
                        ✖ Alphabet Required
                    </p>

                    <p id="rule-length" class="invalid">
                        ✖ Minimum 12 Characters
                    </p>

                </div>

                <input type="password" id="password-check" placeholder="Confirm Password" class="input" required>

                <button type="submit" id="sign-up" class="primary-btn">

                    Create Account

                </button>

            </form>

        </section>

    </main>

    <script src="/javascript/signup.js"></script>

</body>

</html>
