<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
    <title>LOGIN</title>

    <!-- css 파일 연결 -->
    <link rel="stylesheet" href="/css/signup.css">
</head>
<script>

    /* 우클릭 방지 */
    document.addEventListener("contextmenu", (e) => {

        e.preventDefault();
    });

    /* Ctrl + 마우스휠 확대 방지 */
    document.addEventListener("wheel", (e) => {

        if (e.ctrlKey) {

            e.preventDefault();
        }

    }, { passive: false });

    /* Ctrl + +/- 확대 방지 */
    document.addEventListener("keydown", (e) => {

        if (
            (e.ctrlKey || e.metaKey) &&
            (
                e.key === "+" ||
                e.key === "-" ||
                e.key === "="
            )
        ) {

            e.preventDefault();
        }
    });

    /* 모바일 핀치줌 방지 */
    document.addEventListener('touchmove', (e) => {

        if (e.scale !== 1) {

            e.preventDefault();
        }

    }, { passive: false });

</script>

<body>

    <div class="background"></div>

    <main class="layout">

        <!-- LEFT -->
        <section class="hero">

            <div class="badge">
                AUTH SERVICE
            </div>

            <h1>
                Secure Login <br>
                Experience
            </h1>

            <p>
                Session 기반 사용자 인증과 <br>
                Spring Security 보안 기능 구현
            </p>

            <div class="feature-box">

                <div>✔ Secure Session Login</div>

                <div>✔ Password Encryption</div>

                <div>✔ Railway Deployment</div>

            </div>

        </section>

        <!-- RIGHT -->
        <section class="card">

            <div class="top-nav">

                <a href="/">Main</a>

                <a href="/signup">Sign Up</a>

            </div>

            <h2>Welcome Back</h2>

            <p class="description">
                로그인 후 서비스를 이용하세요.
            </p>

            <form action="/login" method="post" class="form">

                <p th:text="${error}" class="error-message">
                </p>

                <input type="email" name="email" placeholder="Email" class="input" required>

                <input type="password" name="password" placeholder="Password" class="input" required>

                <a href="/password" class="forgot-link">

                    Forgot Password?

                </a>

                <button class="primary-btn">

                    Sign In

                </button>

            </form>

        </section>

    </main>

</body>

</html>
